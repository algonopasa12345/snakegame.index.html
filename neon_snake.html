<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Neon Snake</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#07111f;color:white;font-family:Arial,sans-serif;display:flex;justify-content:center}
main{width:min(94vw,720px);padding:20px;text-align:center}
h1{margin:8px 0}
.top{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:14px 0}
.stat{background:#11233e;padding:9px 14px;border-radius:12px;font-weight:bold}
.wrap{background:#101e34;border:1px solid #294566;border-radius:18px;padding:14px}
canvas{display:block;width:100%;max-width:600px;aspect-ratio:1/1;margin:auto;background:#050c16;border-radius:12px;touch-action:none}
button{border:0;border-radius:10px;padding:11px 17px;margin:7px;background:#3478f6;color:white;font-weight:bold;cursor:pointer}
.help{color:#b9cae2;font-size:14px}
.controls{display:grid;grid-template-columns:repeat(3,64px);justify-content:center;gap:7px;margin-top:12px}
.controls button{margin:0;height:52px;font-size:20px}
.blank{visibility:hidden}
</style>
</head>
<body>
<main>
<h1>🐍 Neon Snake</h1>
<p class="help">Come la comida, crece y evita chocar contra las paredes o contra ti mismo.</p>
<div class="top">
<div class="stat">🍎 Puntos: <span id="score">0</span></div>
<div class="stat">🏆 Récord: <span id="best">0</span></div>
<div class="stat">⚡ Nivel: <span id="level">1</span></div>
</div>
<div class="wrap">
<canvas id="game" width="600" height="600"></canvas>
<div>
<button id="start">▶ Empezar / Reiniciar</button>
<button id="pause">⏸ Pausa</button>
</div>
<div class="controls">
<button class="blank">.</button><button data-dir="up">▲</button><button class="blank">.</button>
<button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button>
</div>
<p class="help">Controles: flechas o WASD. También puedes usar los botones en móvil.</p>
</div>
</main>
<script>
(function(){
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),levelEl=document.getElementById("level");
const cells=24,size=canvas.width/cells;
let snake,dir,nextDir,food,score,best=0,timer,running=false,paused=false,speed=125;

try{best=Number(localStorage.getItem("neonSnakeBest")||0)}catch(e){}
bestEl.textContent=best;

function randomFood(){
  let f;
  do{f={x:Math.floor(Math.random()*cells),y:Math.floor(Math.random()*cells)}}while(snake.some(s=>s.x===f.x&&s.y===f.y));
  return f;
}
function reset(){
  clearInterval(timer);
  snake=[{x:12,y:12},{x:11,y:12},{x:10,y:12}];
  dir={x:1,y:0};nextDir={x:1,y:0};score=0;speed=125;paused=false;running=true;
  food=randomFood();updateUI();draw();run();
}
function run(){clearInterval(timer);timer=setInterval(tick,speed)}
function updateUI(){
  scoreEl.textContent=score;
  levelEl.textContent=1+Math.floor(score/5);
  bestEl.textContent=best;
}
function setDir(x,y){
  if(x===-dir.x&&y===-dir.y)return;
  nextDir={x,y};
}
function tick(){
  if(!running||paused)return;
  dir=nextDir;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=cells||head.y<0||head.y>=cells||snake.some(s=>s.x===head.x&&s.y===head.y)){
    gameOver();return;
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score++;
    if(score>best){best=score;try{localStorage.setItem("neonSnakeBest",best)}catch(e){}}
    food=randomFood();
    const newSpeed=Math.max(55,125-Math.floor(score/5)*10);
    if(newSpeed!==speed){speed=newSpeed;run()}
  }else snake.pop();
  updateUI();draw();
}
function draw(){
  ctx.fillStyle="#050c16";ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle="#0d1a2b";ctx.lineWidth=1;
  for(let i=0;i<=cells;i++){ctx.beginPath();ctx.moveTo(i*size,0);ctx.lineTo(i*size,canvas.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*size);ctx.lineTo(canvas.width,i*size);ctx.stroke()}
  ctx.fillStyle="#ff4d62";ctx.beginPath();ctx.arc(food.x*size+size/2,food.y*size+size/2,size*.32,0,Math.PI*2);ctx.fill();
  snake.forEach((s,i)=>{
    ctx.fillStyle=i===0?"#72ff9d":"#29d86f";
    ctx.fillRect(s.x*size+2,s.y*size+2,size-4,size-4);
  });
}
function gameOver(){
  running=false;clearInterval(timer);draw();
  ctx.fillStyle="rgba(0,0,0,.65)";ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="white";ctx.textAlign="center";ctx.font="bold 46px Arial";ctx.fillText("GAME OVER",canvas.width/2,canvas.height/2-15);
  ctx.font="24px Arial";ctx.fillText("Puntos: "+score,canvas.width/2,canvas.height/2+30);
}
document.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(["arrowup","arrowdown","arrowleft","arrowright","w","a","s","d"].includes(k))e.preventDefault();
  if(k==="arrowup"||k==="w")setDir(0,-1);
  if(k==="arrowdown"||k==="s")setDir(0,1);
  if(k==="arrowleft"||k==="a")setDir(-1,0);
  if(k==="arrowright"||k==="d")setDir(1,0);
});
document.querySelectorAll("[data-dir]").forEach(b=>b.addEventListener("click",()=>{
  const d=b.dataset.dir;if(d==="up")setDir(0,-1);if(d==="down")setDir(0,1);if(d==="left")setDir(-1,0);if(d==="right")setDir(1,0);
}));
document.getElementById("start").addEventListener("click",reset);
document.getElementById("pause").addEventListener("click",()=>{if(running)paused=!paused});
snake=[{x:12,y:12},{x:11,y:12},{x:10,y:12}];food={x:17,y:12};score=0;updateUI();draw();
})();
</script>
</body>
</html>
